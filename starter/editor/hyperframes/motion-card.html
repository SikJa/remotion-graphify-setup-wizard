<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hyperframes Motion Card</title>
  <style>
    body{margin:0;background:#08070b;color:white;font-family:Inter,Arial,sans-serif;overflow:hidden}.stage{width:100vw;height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,rgba(245,176,65,.22),transparent 35%),radial-gradient(circle at 85% 80%,rgba(119,27,52,.30),transparent 45%),#08070b}.card{width:min(1100px,84vw);border:1px solid rgba(245,176,65,.38);border-radius:36px;background:rgba(255,255,255,.055);padding:72px;box-shadow:0 40px 120px rgba(0,0,0,.5)}.eyebrow{letter-spacing:.24em;text-transform:uppercase;color:#f5b041;font-weight:700}.title{font-size:clamp(54px,7vw,110px);line-height:.92;margin:24px 0}.body{font-size:clamp(22px,2.4vw,36px);color:#d8d3c8;max-width:900px}
  </style>
</head>
<body><main class="stage"><section class="card"><div class="eyebrow">Hyperframes</div><h1 class="title">Motion graphics that explain the system</h1><p class="body">Use this as a clean public starting point for animated cards, overlays, arrows, process maps, and editorial transitions.</p></section></main></body>
</html>
